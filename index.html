<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
<title>Catatan Sewa Alat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;background:#F4F6F8;color:#1A2332;line-height:1.4;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#1E293B,#334155);color:#fff;padding:16px 12px 0}
header h1{font-size:18px;font-weight:700;margin:0 0 4px}
header p{font-size:12px;opacity:0.7;margin:0 0 12px}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;color:rgba(255,255,255,0.6);border:0;font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;border-radius:8px 8px 0 0}
.tabs button.active{color:#fff;background:rgba(255,255,255,0.1);border-bottom:3px solid #3B82F6}
main{padding:12px}
section{margin-bottom:16px}
h2{font-size:14px;font-weight:600;color:#1A2332;margin:0 0 10px}
.banner{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-left:4px solid #F59E0B;color:#92400E;padding:10px 12px;font-size:12px;border-radius:0 8px 8px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.stat small{display:block;font-size:9px;font-weight:600;text-transform:uppercase;color:#6B7785;margin-bottom:2px}
.stat b{font-size:16px;font-weight:700}
.stat.warn b{color:#EF4444}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tool{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,0.06);cursor:pointer;position:relative}
.tool:active{transform:scale(0.98)}
.tool h3{font-size:13px;font-weight:600;margin:0 0 2px}
.tool .rate{font-size:11px;color:#6B7785}
.tool .st{font-size:10px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px}
.tool .st::before{content:'';width:6px;height:6px;border-radius:50%}
.tool .st.on{color:#EF4444}.tool .st.on::before{background:#EF4444}
.tool .st.off{color:#10B981}.tool .st.off::before{background:#10B981}
.tool .gear{position:absolute;top:6px;right:6px;background:#F4F6F8;border:1px solid #E1E5EB;color:#6B7785;border-radius:4px;font-size:8px;padding:2px 5px;cursor:pointer}
.add{border:2px dashed #E1E5EB;display:flex;align-items:center;justify-content:center;border-radius:10px;min-height:60px;font-size:12px;font-weight:600;color:#6B7785}
.bar{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bar-top{display:flex;justify-content:space-between;align-items:center}
.btn{background:#3B82F6;color:#fff;border:0;border-radius:6px;padding:8px 12px;font-size:11px;font-weight:600;cursor:pointer;box-shadow:0 2px 4px rgba(59,130,246,0.3)}
.btn:active{transform:scale(0.97)}
.btn.sec{background:#fff;color:#1A2332;border:1px solid #E1E5EB;box-shadow:none}
.btn.danger{background:transparent;color:#EF4444;border:1px solid #EF4444}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.row-info{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.row .t{font-size:13px;font-weight:600}
.row .s{font-size:11px;color:#6B7785}
.row .amt{text-align:right}
.row .amt .total{font-size:14px;font-weight:700}
.row .amt .sisa{font-size:10px;color:#6B7785}
.chip{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;display:inline-block}
.chip.lunas{background:rgba(16,185,129,0.15);color:#059669}
.chip.dp{background:rgba(245,158,11,0.15);color:#D97706}
.chip.belum{background:rgba(239,68,68,0.15);color:#DC2626}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid #E1E5EB;margin-top:8px}
.acts button{font-size:10px;padding:6px 8px;flex:1;min-width:0}
.empty{padding:24px;text-align:center;color:#6B7785;font-size:12px;border:1px dashed #E1E5EB;border-radius:10px}
dialog{position:fixed;bottom:0;left:0;right:0;border:0;border-radius:16px 16px 0 0;padding:0;width:100%;max-width:100%;background:#fff;max-height:90vh;overflow-y:auto}
dialog::backdrop{background:rgba(15,23,42,0.5)}
form{padding:16px;display:flex;flex-direction:column;gap:12px}
form h2{font-size:16px;margin:0}
label{font-size:12px;font-weight:600;color:#1A2332;display:flex;flex-direction:column;gap:4px}
input,select{font-size:14px;padding:10px;border:2px solid #E1E5EB;border-radius:8px;width:100%}
input:focus,select:focus{border-color:#3B82F6;outline:none}
.two{display:grid;grid-template-columns:1fr;gap:8px}
.sum{background:rgba(59,130,246,0.08);padding:10px;font-size:12px;border-left:3px solid #3B82F6;border-radius:6px}
.fa{display:flex;gap:8px;justify-content:flex-end}
.note{font-size:11px;color:#6B7785}
.cc{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,0.06)}
.cc h3{font-size:13px;margin:0 0 10px}
.cc svg{width:100%;height:auto}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ctl label{font-size:11px;font-weight:500;flex-direction:row;align-items:center;gap:6px;min-width:100%}
.ctl select{font-size:12px;padding:6px 10px}
@media(min-width:768px){
main{max-width:800px;margin:0 auto;padding:20px}
.stats{grid-template-columns:repeat(4,1fr);gap:12px}
.tools{grid-template-columns:repeat(3,1fr);gap:12px}
.tool{padding:14px}
.tool h3{font-size:15px}
.stat b{font-size:20px}
.bar{flex-direction:row;align-items:center}
.acts button{font-size:11px;padding:8px 12px}
dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);bottom:auto;border-radius:16px;max-width:420px}
dialog::backdrop{background:rgba(15,23,42,0.7)}
.two{grid-template-columns:1fr 1fr}
}
@media(prefers-color-scheme:dark){
body{background:#0F172A;color:#E2E8F0}
header{background:linear-gradient(135deg,#020617,#0F172A)}
.stat,.tool,.row,.cc{background:#1E293B}
.stat small,.tool .rate,.tool .st,.row .s,.row .amt .sisa,.empty,.note{color:#94A3B8}
.tool .gear{background:#0F172A;border-color:#334155}
input,select{background:#0F172A;border-color:#334155;color:#E2E8F0}
.acts{border-color:#334155}
dialog{background:#1E293B}
form h2,.ctl label{color:#E2E8F0}
label{color:#E2E8F0}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
.tools{grid-template-columns:1fr}
}
</style>

<body>
<header><h1>Catatan Sewa Alat</h1><p>Klik alat, isi tanggal, tercatat otomatis.</p><div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="catat">Catat sewa</button><button role="tab" aria-selected="false" data-tab="perf">Performa</button></div></header>
<main id="v-catat">
<div id="banner"></div>
<section><h2>Ringkasan bulan ini</h2><div class="stats" id="stats"></div></section>
<section><h2>Pilih alat yang disewa</h2><div class="tools" id="tools"></div></section>
<section>
<div class="bar"><h2 style="margin:0">Riwayat sewa</h2><button class="btn sec" id="dl">Unduh Excel / CSV</button></div>
<div class="bar"><div class="ctl" style="margin:0"><button class="btn" id="va">Aktif</button><button class="btn sec" id="vz">Arsip</button></div><button class="btn sec" id="ba">Arsipkan yang lunas</button></div>
<div class="list" id="list"></div>
<p class="note">Data tersimpan di browser perangkat ini saja. Unduh Excel secara rutin sebagai cadangan.</p>
</section>
</main>
<main id="v-perf" hidden></main>
<dialog id="dlg"></dialog>
<script>
(function(){
var KEY="rental-alat-v1",BK="rental-alat-backup";
var st={tools:[{id:"t1",name:"Molen 1",rate:350000},{id:"t2",name:"Molen 2",rate:350000},{id:"t3",name:"Vibrator",rate:150000}],rentals:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.tools&&p.rentals)st=p;}}catch(e){}
st.biz=st.biz||{};if(!st.biz.name)st.biz.name="FIRZA JAYA TEKNIK";if(!st.biz.contact)st.biz.contact="Telp/WA: 085282832520";
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9);}
function pad(n){return n<10?"0"+n:""+n;}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function rp(n){return "Rp "+Math.round(n||0).toLocaleString("id-ID");}
function days(s,e){return Math.round((new Date(e+"T00:00:00")-new Date(s+"T00:00:00"))/864e5)+1;}
function total(r){return days(r.start,r.end)*r.rate+(r.delivery||0);}
function fd(s){var a=s.split("-");return a[2]+"/"+a[1]+"/"+a[0];}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function tool(id){return st.tools.filter(function(t){return t.id===id;})[0];}
function active(tid){var t=today();return st.rentals.filter(function(r){return r.toolId===tid&&r.start<=t&&r.end>=t;})[0];}
function upcoming(tid){var t=today();return st.rentals.filter(function(r){return r.toolId===tid&&r.start>t;}).sort(function(a,b){return a.start<b.start?-1:1;})[0];}
function $(i){return document.getElementById(i);}
var dlg=$("dlg");
var av=false;
function isArch(r){return !!r.arch&&total(r)-(r.paid||0)<=0;}
function render(){
var m=today().slice(0,7),mr=st.rentals.filter(function(r){return r.start.slice(0,7)===m;});
var inc=0,paid=0;mr.forEach(function(r){inc+=total(r);paid+=r.paid||0;});
var owed=0;st.rentals.forEach(function(r){owed+=Math.max(0,total(r)-(r.paid||0));});
var busy=st.tools.filter(function(t){return active(t.id);}).length;
$("stats").innerHTML=s("Pemasukan (nilai sewa)",rp(inc))+s("Sudah diterima",rp(paid))+s("Transaksi",mr.length)+s("Alat sedang disewa",busy+" dari "+st.tools.length)+'<div class="stat '+(owed>0?"warn":"")+'"><small>Total belum dibayar (semua waktu)</small><b>'+rp(owed)+"</b></div>";
function s(a,b){return '<div class="stat"><small>'+a+"</small><b>"+b+"</b></div>";}
var h="";
st.tools.forEach(function(t){var a=active(t.id),u=upcoming(t.id),txt;if(a)txt='<div class="st on">Disewa sampai '+fd(a.end)+"</div>";else txt='<div class="st off">Tersedia'+(u?" (booking "+fd(u.start)+")":"")+"</div>";h+='<div class="tool" role="button" tabindex="0" data-rent="'+t.id+'"><h3>'+esc(t.name)+'</h3><div class="rate">'+rp(t.rate)+" / hari</div>"+txt+'<button class="gear" data-edit="'+t.id+'">Ubah</button></div>';});
h+='<button class="tool add" data-addtool="1">+ Tambah alat</button>';
$("tools").innerHTML=h;
var na=0,nz=0;st.rentals.forEach(function(r){if(isArch(r))nz++;else na++;});
$("va").textContent="Aktif ("+na+")";$("vz").textContent="Arsip ("+nz+")";
$("va").className="btn "+(av?"sec":"");$("vz").className="btn "+(av?"":"sec");$("ba").hidden=av;
var rs=st.rentals.filter(function(r){return isArch(r)===av;}).sort(function(a,b){return a.start<b.start?1:-1;});
if(!rs.length)$("list").innerHTML='<div class="empty">'+(av?"Arsip kosong. Catatan yang sudah lunas bisa dipindahkan ke sini lewat tombol Arsipkan.":"Belum ada catatan. Klik salah satu alat di atas untuk mulai.")+'</div>';else $("list").innerHTML=rs.map(function(r){var t=tool(r.toolId),tot=total(r),sisa=tot-(r.paid||0),c=sisa<=0?"lunas":(r.paid>0?"dp":"belum"),l=sisa<=0?"Lunas":(r.paid>0?"DP":"Belum bayar");return '<div class="row"><div class="row-header"><div><div class="t">'+esc(t?t.name:"(alat dihapus)")+" - "+esc(r.customer)+'<span class="chip '+c+'">'+l+'</span></div><div class="s">'+fd(r.start)+" s/d "+fd(r.end)+" ("+days(r.start,r.end)+" hari)"+(r.note?" | "+esc(r.note):"")+'</div></div><div class="amt">'+rp(tot)+'<div class="s">'+(sisa>0?"Sisa "+rp(sisa):"Terbayar")+'</div></div></div><div class="acts">'+(sisa>0?'<button class="btn" data-pay="'+r.id+'">Catat bayar</button>':'<button class="btn" data-inv="'+r.id+'">Invoice</button>')+(sisa<=0?(r.arch?'<button class="btn sec" data-unarch="'+r.id+'">Kembalikan</button>':'<button class="btn sec" data-arch="'+r.id+'">Arsipkan</button>'):'')+'<button class="btn sec" data-redit="'+r.id+'">Ubah</button><button class="btn danger" data-del="'+r.id+'">Hapus</button></div></div>';}).join("");banner();}
function banner(){var b="";try{b=localStorage.getItem(BK)||"";}catch(e){}var msg="";if(st.rentals.length){if(!b)msg="Data belum pernah dicadangkan. Klik <b>Unduh Excel / CSV</b> supaya tidak hilang kalau browser dibersihkan.";else if((Date.now()-Number(b))>7*864e5)msg="Cadangan terakhir lebih dari 7 hari lalu. Sebaiknya unduh lagi.";}$("banner").innerHTML=msg?'<div class="banner">'+msg+"</div>":"";}
function open(html){dlg.innerHTML=html;if(!dlg.open)dlg.showModal();}
function close(){dlg.close();}
function rentForm(toolId,rid){var r=rid?st.rentals.filter(function(x){return x.id===rid;})[0]:null,t=tool(toolId);var v=r||{toolId:toolId,customer:"",start:today(),end:today(),rate:t.rate,delivery:0,paid:0,note:"",phone:""};open('<form id="f"><h2>'+esc(t.name)+(r?" - ubah sewa":"")+'</h2><label>Nama pelanggan<input id="c" required value="'+esc(v.customer)+'"></label><div class="two"><label>Tanggal mulai<input type="date" id="s" required value="'+v.start+'"></label><label>Tanggal selesai<input type="date" id="e" required value="'+v.end+'"></label></div><div class="two"><label>Tarif per hari (Rp)<input type="number" id="ra" min="0" inputmode="numeric" value="'+v.rate+'"></label><label>Ongkos antar (Rp)<input type="number" id="d" min="0" inputmode="numeric" value="'+(v.delivery||0)+'"></label></div><label>Dibayar sekarang / DP (Rp)<input type="number" id="p" min="0" inputmode="numeric" value="'+(v.paid||0)+'"></label><label>Catatan / lokasi proyek<input id="n" value="'+esc(v.note)+'"></label><label>No. WhatsApp pelanggan (opsional)<input id="ph" type="tel" inputmode="tel" placeholder="08123456789" value="'+esc(v.phone||"")+'"></label><div class="sum" id="sum"></div><div class="err" id="er"></div><div class="fa"><button type="button" class="btn sec" id="x">Batal</button><button class="btn" type="submit">Simpan</button></div></form>');function g(i){return $(i).value;}function calc(){var s=g("s"),e=g("e");if(!s||!e||e<s){$("sum").textContent="Tanggal selesai harus sama atau setelah tanggal mulai.";return null;}var o={toolId:toolId,customer:g("c").trim(),start:s,end:e,rate:+g("ra")||0,delivery:+g("d")||0,paid:+g("p")||0,note:g("n").trim(),phone:g("ph").trim()};var tot=total(o);$("sum").innerHTML=days(s,e)+" hari. Total <b>"+rp(tot)+"</b>. Sisa <b>"+rp(Math.max(0,tot-o.paid))+"</b>.";return o;}["c","s","e","ra","d","p","n","ph"].forEach(function(i){$(i).addEventListener("input",calc);});calc();$("x").onclick=close;$("f").onsubmit=function(ev){ev.preventDefault();var o=calc();if(!o)return;var clash=st.rentals.filter(function(x){return x.toolId===toolId&&(!r||x.id!==r.id)&&x.start<=o.end&&o.start<=x.end;})[0];if(clash){$("er").textContent="Bentrok: "+t.name+" sudah disewa "+clash.customer+" tanggal "+fd(clash.start)+" s/d "+fd(clash.end)+".";return;}var was=r&&total(r)-(r.paid||0)<=0,rec;if(r){Object.assign(r,o);rec=r;}else{o.id=uid();st.rentals.push(o);rec=o;}save();close();render();if(!was&&total(rec)-(rec.paid||0)<=0)invoice(rec.id);};}
function toolForm(id){var t=id?tool(id):{name:"",rate:0};open('<form id="f"><h2>'+(id?"Ubah alat":"Tambah alat")+'</h2><label>Nama alat<input id="a" required value="'+esc(t.name)+'"></label><label>Tarif default per hari (Rp)<input id="b" type="number" min="0" inputmode="numeric" value="'+t.rate+'"></label><p class="note">Mengubah tarif tidak mengubah catatan sewa yang sudah ada.</p><div class="fa">'+(id?'<button type="button" class="btn danger" id="dd">Hapus alat</button>':"")+'<button type="button" class="btn sec" id="x">Batal</button><button class="btn" type="submit">Simpan</button></div></form>');$("x").onclick=close;if(id)$("dd").onclick=function(){var n=st.rentals.filter(function(r){return r.toolId===id;}).length;if(n){$("dd").textContent="Alat punya "+n+" catatan, tidak bisa dihapus";$("dd").disabled=true;return;}st.tools=st.tools.filter(function(x){return x.id!==id;});save();close();render();};$("f").onsubmit=function(ev){ev.preventDefault();var nm=$("a").value.trim(),rt=+$("b").value||0;if(id){t.name=nm;t.rate=rt;}else st.tools.push({id:uid(),name:nm,rate:rt});save();close();render();};}
function payForm(rid){var r=st.rentals.filter(function(x){return x.id===rid;})[0],sisa=total(r)-(r.paid||0);open('<form id="f"><h2>Catat pembayaran</h2><p style="margin:0">'+esc(r.customer)+". Sisa "+rp(sisa)+'</p><label>Jumlah dibayar (Rp)<input id="a" type="number" min="1" inputmode="numeric" value="'+sisa+'" required></label><div class="fa"><button type="button" class="btn sec" id="x">Batal</button><button class="btn" type="submit">Simpan</button></div></form>');$("x").onclick=close;$("f").onsubmit=function(ev){ev.preventDefault();r.paid=(r.paid||0)+(+$("a").value||0);save();close();render();if(total(r)-r.paid<=0)invoice(r.id);};}
function delForm(rid){open('<form id="f"><h2>Hapus catatan ini?</h2><p style="margin:0">Catatan yang dihapus tidak bisa dikembalikan.</p><div class="fa"><button type="button" class="btn sec" id="x">Batal</button><button class="btn danger" type="submit">Hapus</button></div></form>');$("x").onclick=close;$("f").onsubmit=function(ev){ev.preventDefault();st.rentals=st.rentals.filter(function(r){return r.id!==rid;});save();close();render();};}
function csv(){var q=function(v){v=String(v==null?"":v);return '"'+v.replace(/"/g,'""')+'"';};var rows=[["Tanggal mulai","Tanggal selesai","Alat","Pelanggan","Lama (hari)","Tarif/hari","Ongkos antar","Total","Dibayar","Sisa","Status","Catatan"]];st.rentals.slice().sort(function(a,b){return a.start<b.start?-1:1;}).forEach(function(r){var t=tool(r.toolId),tot=total(r),sisa=Math.max(0,tot-(r.paid||0));rows.push([r.start,r.end,t?t.name:"",r.customer,days(r.start,r.end),r.rate,r.delivery||0,tot,r.paid||0,sisa,sisa===0?"Lunas":(r.paid>0?"DP":"Belum bayar"),r.note]);});return "﻿"+rows.map(function(r){return r.map(q).join(",");}).join("\r\n");}
function dlCsv(){var name="sewa-alat-"+today()+".csv";if(window.claude&&claude.use){claude.use("downloads").then(function(d){if(!d){alert("Unduh tidak tersedia di tampilan ini.");return;}return d.save({filename:name,data:csv()}).then(function(){try{localStorage.setItem(BK,String(Date.now()));}catch(e){}banner();}).catch(function(){});}).catch(function(){alert("Unduh gagal. Coba lagi.");});}else alert("Unduh tidak tersedia di tampilan ini.");};

function chart(labels,vals,isMoney){var W=600,H=240,L=isMoney?52:34,R=16,T=20,B=30,n=vals.length,mx=Math.max.apply(null,vals.concat([0]));var step=nice(mx/4);if(!isMoney)step=Math.max(1,step);var top=step*Math.max(1,Math.ceil(mx/step));var X=function(i){return L+i*(W-L-R)/(n-1);},Y=function(v){return T+(H-T-B)*(1-v/top);};var g="",k;for(k=0;k<=top+1e-9;k+=step){g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(k)+'" y2="'+Y(k)+'"/><text x="'+(L-6)+'" y="'+(Y(k)+4)+'" text-anchor="end">'+(isMoney?sh(k):k)+'</text>';}var pts=vals.map(function(v,i){return X(i)+","+Y(v);}).join(" ");var area=X(0)+","+Y(0)+" "+pts+" "+X(n-1)+","+Y(0);var d="";vals.forEach(function(v,i){d+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle">'+labels[i]+'</text>';d+='<circle class="dt" cx="'+X(i)+'" cy="'+Y(v)+'" r="4"/>';if(v>0)d+='<text class="vl" x="'+X(i)+'" y="'+(Y(v)-9)+'" text-anchor="middle">'+(isMoney?sh(v):v)+'</text>';});return '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'<polygon class="ar" points="'+area+'"/><polyline class="ln" points="'+pts+'"/>'+d+'</svg>';}
function perf(){var yrs={};yrs[+today().slice(0,4)]=1;st.rentals.forEach(function(r){yrs[+r.start.slice(0,4)]=1;});var ys=Object.keys(yrs).sort();var yc=[],yi=[],i;for(i=0;i<12;i++){yc.push(0);yi.push(0);}var dim=new Date(py,pm+1,0).getDate(),nw=Math.ceil(dim/7),wc=[],wi=[];for(i=0;i<nw;i++){wc.push(0);wi.push(0);}st.rentals.forEach(function(r){var y=+r.start.slice(0,4),m=+r.start.slice(5,7)-1,dd=+r.start.slice(8,10);if(y!==py)return;yc[m]++;yi[m]+=total(r);if(m===pm){var w=Math.min(nw-1,Math.floor((dd-1)/7));wc[w]++;wi[w]+=total(r);}});var sum=function(a){return a.reduce(function(x,y){return x+y;},0);};var best=yi.indexOf(Math.max.apply(null,yi));var ml=MN.map(function(m){return m.slice(0,3);});var wl=wc.map(function(_,i){var a=i*7+1,b=Math.min(dim,a+6);return a+"-"+b;});$("v-perf").innerHTML='<div class="ctl"><label>Tahun<select id="py">'+ys.map(function(y){return '<option'+(+y===py?" selected":"")+'>'+y+'</option>';}).join("")+'</select></label><label>Bulan (untuk grafik mingguan)<select id="pm">'+MN.map(function(m,i){return '<option value="'+i+'"'+(i===pm?" selected":"")+'>'+m+'</option>';}).join("")+'</select></label></div>'+'<div class="stats" style="margin-bottom:14px"><div class="stat"><small>Sewa tahun '+py+'</small><b>'+sum(yc)+'</b></div><div class="stat"><small>Pemasukan tahun '+py+'</small><b>'+rp(sum(yi))+'</b></div><div class="stat"><small>Bulan terbaik</small><b>'+(sum(yi)>0?MN[best]:"-")+'</b></div><div class="stat"><small>Pemasukan '+MN[pm]+'</small><b>'+rp(sum(wi))+'</b></div></div>'+'<div class="cc"><h3>Jumlah sewa per bulan, '+py+'</h3>'+chart(ml,yc,false)+'</div>'+'<div class="cc"><h3>Pemasukan per bulan, '+py+'</h3>'+chart(ml,yi,true)+'</div>'+'<div class="cc"><h3>Jumlah sewa per minggu, '+MN[pm]+' '+py+'</h3>'+chart(wl,wc,false)+'<p class="note">Minggu dihitung per tanggal: 1-7, 8-14, dst.</p></div>'+'<div class="cc"><h3>Pemasukan per minggu, '+MN[pm]+' '+py+'</h3>'+chart(wl,wi,true)+'</div>'+'<p class="note">Sewa dan pemasukan dihitung pada function invPDF(r){var t=tool(r.toolId),b=st.biz||{},d=days(r.start,r.end),tot=total(r);var{pdf:jspdf}=window;var doc=new jspdf({unit:'mm',format:'a5'});doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(b.name||'Nama Usaha',10,15);doc.setFont('helvetica','');doc.setFontSize(9);doc.text(b.contact||'',10,20);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text('INVOICE '+r.inv,10,32);doc.setFont('helvetica','');doc.setFontSize(9);doc.text('Tanggal: '+fd(r.invDate),10,40);doc.text('Kepada: '+r.customer,10,46);if(r.note)doc.text('Lokasi: '+r.note,10,52);doc.setDrawColor(200);doc.line(10,58,200,58);doc.setFont('helvetica','');doc.setFontSize(9);var y=62;doc.text('Sewa '+esc(t?t.name:'alat'),10,y);doc.text(fd(r.start)+' - '+fd(r.end)+' ('+d+' hari)',10,y+5);doc.text(rp(d*r.rate),180,y+5,'right');y+=14;if(r.delivery){doc.text('Ongkos Antar',10,y);doc.text(rp(r.delivery),180,y,'right');y+=8;}doc.line(10,y,200,y);y+=8;doc.setFont('helvetica','bold');doc.text('Total',10,y);doc.text(rp(tot),180,y,'right');y+=6;doc.setFont('helvetica','');doc.text('Dibayar',10,y);doc.text(rp(r.paid),180,y,'right');y+=12;doc.setFillColor(16,185,129);doc.rect(75,y,50,10,'F');doc.setTextColor(255);doc.setFontSize(11);doc.text('LUNAS',100,y+6,'center');y+=18;doc.setTextColor(100);doc.setFontSize(8);doc.text('Terima kasih atas kepercayaan Anda.',100,y,'center');return doc;}function invBody(r){var t=tool(r.toolId),b=st.biz||{},d=days(r.start,r.end),tot=total(r),R="text-align:right;",C="padding:6px 0;border-bottom:1px solid #ddd";var rows='<tr><td style="'+C+'">Sewa '+esc(t?t.name:"alat")+'<br><span style="color:#666;font-size:12px">'+fd(r.start)+' s/d '+fd(r.end)+' ('+d+' hari x '+rp(r.rate)+')</span></td><td style="'+R+C+'">'+rp(d*r.rate)+'</td></tr>';if(r.delivery)rows+='<tr><td style="'+C+'">Ongkos antar</td><td style="'+R+C+'">'+rp(r.delivery)+'</td></tr>';return '<div style="background:#fff;color:#111;padding:18px;font:14px/1.4 Arial,sans-serif"><div style="font-size:20px;font
